name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download Dalamud
        shell: pwsh
        run: |
          $env:DALAMUD_HOME = "${{ github.workspace }}\dalamud"
          New-Item -ItemType Directory -Force -Path $env:DALAMUD_HOME | Out-Null
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip $env:DALAMUD_HOME

      - name: Build
        shell: pwsh
        run: |
          $env:DALAMUD_HOME = "${{ github.workspace }}\dalamud"
          dotnet build BozjaPilot/BozjaPilot.csproj -c Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item BozjaPilot/bin/Release/BozjaPilot.dll out/
          Copy-Item BozjaPilot/bin/Release/BozjaPilot.json out/
          Compress-Archive -Path out/* -DestinationPath BozjaPilot.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BozjaPilot
          path: BozjaPilot.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BozjaPilot.zip
          overwrite_files: true
          generate_release_notes: true
